# .github/workflows/python-publish.yaml
name: Publish Python Package

on:
  # Only trigger on release creation, not directly on tag push
  release:
    types: [created]

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./python
    
    # Restrict to repository owners/collaborators
    permissions:
      id-token: write  # for trusted publishing to PyPI
      contents: read   # to read the repository content
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install hatchling build twine
    
    - name: Build and verify package
      run: |
        python -m build
        twine check dist/*
    
    # Publish to TestPyPI first to verify
    - name: Publish to TestPyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        repository-url: https://test.pypi.org/legacy/
        packages-dir: python/dist/
        skip-existing: true
        verbose: true
    
    # Publish to PyPI only after confirmation
    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        packages-dir: python/dist/
        verbose: true